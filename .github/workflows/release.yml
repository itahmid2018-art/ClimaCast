name: Release CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom release tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release Variants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Code Linter & Type Check
        run: npm run lint

      - name: Build Full-Stack Production Bundle
        run: npm run build

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            BASE_VER=$(node -p "require('./package.json').version || '1.0.0'")
            TAG="v${BASE_VER}-build.${{ github.run_number }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${TAG}"

      - name: Package All Multi-Platform Variants
        run: node scripts/package-variants.js "${{ env.RELEASE_TAG }}"

      - name: Tag Git Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            git tag -a "${{ env.RELEASE_TAG }}" -m "ClimaCast Automated Release ${{ env.RELEASE_TAG }}"
            git push origin "${{ env.RELEASE_TAG }}" || echo "Tag push skipped or already exists on remote"
          fi

      - name: Publish GitHub Release & Upload Public Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "ClimaCast Release ${{ env.RELEASE_TAG }}"
          body_path: release-artifacts/release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-github-pages:
    name: Deploy Web PWA to GitHub Pages
    needs: build-and-release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Production Distribution
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
